name: EV Cockpit · Release variant smoke verification (NO DISTRIBUTION)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-release-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-smoke:
    name: Offline release variant compile with throwaway signature
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout only reviewed pull-request sources
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Android SDK 36 and APK tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk"
          test -s "$sdk/platforms/android-36/android.jar"
          test -x "$sdk/build-tools/36.0.0/apksigner"

      - name: Verify Gradle wrapper and cache
        uses: gradle/actions/setup-gradle@0f4528296b4bc09e8ae0fc7be30185a4ab435545 # v6.0.0
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Reject legacy YouTube filter source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_no_youtube_ad_filter.py' -v
          python3 scripts/verify_youtube_filter_absent.py

      - name: Lint and build shrinking Release APK with disposable CI keystore
        shell: bash
        run: |
          set -euo pipefail
          # The repository's real signed release workflow remains SECURITY-HELD.
          # This throwaway signature is generated for CI ONLY and MUST NOT ship.
          keystore="$RUNNER_TEMP/ci-verification-only.p12"
          trap 'rm -f "$keystore"' EXIT
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$keystore" -storepass 'not-for-distribution-ci' \
            -alias ci-temporary -keypass 'not-for-distribution-ci' \
            -keyalg RSA -keysize 3072 -validity 1 \
            -dname 'CN=Ephemeral CI Only, O=Never Distribute'
          export EYA_RELEASE_STORE_FILE="$keystore"
          export EYA_RELEASE_STORE_PASSWORD='not-for-distribution-ci'
          export EYA_RELEASE_KEY_ALIAS='ci-temporary'
          export EYA_RELEASE_KEY_PASSWORD='not-for-distribution-ci'
          ./gradlew :nativecockpit:lintRelease :nativecockpit:assembleRelease \
            --no-daemon --stacktrace

      - name: Verify R8, network policy, identity, ABI and output size (NO upload of APK)
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apk=nativecockpit/build/outputs/apk/release/nativecockpit-release.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          test -s nativecockpit/build/outputs/mapping/release/mapping.txt
          test -s nativecockpit/src/main/res/xml/network_security_config.xml
          grep -Fq 'cleartextTrafficPermitted="false"' \
            nativecockpit/src/main/res/xml/network_security_config.xml
          grep -Fq 'android:allowBackup="false"' nativecockpit/src/main/AndroidManifest.xml
          grep -Fq 'android:usesCleartextTraffic="false"' nativecockpit/src/main/AndroidManifest.xml
          grep -Fq 'android:networkSecurityConfig="@xml/network_security_config"' \
            nativecockpit/src/main/AndroidManifest.xml
          "$sdk/build-tools/36.0.0/apksigner" verify --verbose "$apk" \
            > "$RUNNER_TEMP/ci-release-signature.txt"
          "$sdk/build-tools/36.0.0/aapt" dump badging "$apk" \
            > "$RUNNER_TEMP/ci-release-badging.txt"
          grep -Fq "package: name='com.evcockpit'" "$RUNNER_TEMP/ci-release-badging.txt"
          grep -Fq "versionName='1.0.8'" "$RUNNER_TEMP/ci-release-badging.txt"
          if grep -Fq 'application-debuggable' "$RUNNER_TEMP/ci-release-badging.txt"; then
            echo '::error::Release APK is debuggable'; exit 1
          fi
          mapfile -t abis < <(
            unzip -Z1 "$apk" | grep '^lib/' | cut -d/ -f2 | sort -u
          )
          if [ "${#abis[@]}" -ne 1 ] || [ "${abis[0]}" != "arm64-v8a" ]; then
            printf '::error::Unexpected packaged ABIs: %s\n' "${abis[*]}"
            exit 1
          fi
          bytes="$(stat -c %s "$apk")"
          target_bytes=$((80 * 1024 * 1024))
          if [ "$bytes" -gt "$target_bytes" ]; then
            echo "::error::Release APK exceeds initial 80 MiB ceiling ($bytes bytes)"
            exit 1
          fi
          sha256sum "$apk" | sed 's# .*#  RELEASE_SMOKE_NO_PUBLISH#' \
            > "$RUNNER_TEMP/release-smoke.txt"
          {
            echo 'BUILD TYPE: release (R8 + resources shrink)'
            echo 'SIGNATURE: throwaway CI key, NOT production'
            echo 'PLAY/VEHICLE ACCEPTANCE: NOT VERIFIED'
            echo 'DISTRIBUTION: PROHIBITED'
            echo 'APPLICATION ID: com.evcockpit'
            echo 'VERSION: 1.0.8 (no -TEST)'
            echo 'DEBUGGABLE: false'
            echo 'ABI: arm64-v8a'
            echo "BYTES: $bytes"
            echo "MAX_BYTES: $target_bytes"
          } >> "$RUNNER_TEMP/release-smoke.txt"
          cat "$RUNNER_TEMP/release-smoke.txt"
          python3 scripts/check_apk_secrets.py "$apk"
          # Even an obfuscated Release APK must not be mistaken for proof
          # about a DIFFERENT YouTube-containing media module APK.

      - name: Upload verification report only (never release APK or temporary key)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-release-smoke-report-NOT-FOR-DISTRIBUTION
          path: |
            ${{ runner.temp }}/release-smoke.txt
            nativecockpit/build/reports/lint-results-release.html
            nativecockpit/build/reports/lint-results-release.xml
          if-no-files-found: warn
          retention-days: 7
